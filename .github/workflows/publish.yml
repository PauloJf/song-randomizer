name: publish

# Fires on every version tag push (e.g. `v0.1`, `v0.1.0`, `v1.2.3-rc1`),
# or manually from the Actions tab (publishes :latest from the chosen ref).
# Requires two repo secrets:
#   DOCKERHUB_USERNAME — the Docker Hub account that owns the image
#   DOCKERHUB_PASSWORD — a personal access token with Read, Write & Delete
#                        scope (Delete is required by the description API
#                        that the README sync step uses)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/song-randomizer
          # Turns any `vX...` tag into the same string without the leading `v`:
          #   v0.1     → 0.1
          #   v0.1.0   → 0.1.0
          #   v1.0-rc1 → 1.0-rc1  (and doesn't move `latest`)
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/song-randomizer
          short-description: "Spotify playlist roulette — one shared queue, no repeats."
          readme-filepath: ./README.md
